<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Theme Accents -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>

    <linearGradient id="streamGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 42px;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 17px;
      font-weight: 400;
      fill: #94a3b8;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
      font-weight: 600;
      fill: #e2e8f0;
    }
    .node-label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      font-size: 11px;
      fill: #cbd5e1;
    }
    .flow-line {
      stroke-dasharray: 8 6;
      animation: dashMove 12s linear infinite;
    }
    @keyframes dashMove {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -200; }
    }
    .pulse-node {
      animation: pulseAnim 3s ease-in-out infinite alternate;
    }
    @keyframes pulseAnim {
      0% { opacity: 0.4; transform: scale(0.96); }
      100% { opacity: 0.9; transform: scale(1.04); }
    }
    .float-card {
      animation: floatAnim 6s ease-in-out infinite alternate;
    }
    @keyframes floatAnim {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />

  <!-- Grid Lattice -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="0.8">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Dynamic Ambient Glow Spots (Background layer) -->
  <circle cx="1020" cy="110" r="130" fill="#6366f1" opacity="0.15" filter="url(#softGlow)" />
  <circle cx="910" cy="240" r="110" fill="#06b6d4" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="150" cy="90" r="100" fill="#8b5cf6" opacity="0.1" filter="url(#softGlow)" />

  <!-- Animated Neural Recommendation Flow (Background - Right Side) -->
  <g opacity="0.75" class="float-card">
    <!-- Curved Pipeline Flows -->
    <path d="M 800 100 C 860 70, 920 150, 980 110 S 1080 140, 1120 100" fill="none" stroke="url(#streamGrad1)" stroke-width="2.5" class="flow-line" />
    <path d="M 790 190 C 870 170, 910 260, 990 220 S 1060 210, 1130 250" fill="none" stroke="url(#streamGrad1)" stroke-width="2" class="flow-line" />
    <path d="M 820 140 C 890 210, 950 120, 1030 180 S 1100 170, 1140 180" fill="none" stroke="url(#streamGrad1)" stroke-width="2.5" class="flow-line" />

    <!-- Feature Nodes & Graph Nodes -->
    <!-- Node 1: User Feature Store -->
    <g transform="translate(810, 90)">
      <rect width="105" height="38" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="18" cy="19" r="6" fill="#38bdf8" />
      <text x="32" y="23" class="node-label">User Profile</text>
    </g>

    <!-- Node 2: Vector Search / Embedding -->
    <g transform="translate(930, 160)">
      <rect width="115" height="38" rx="8" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" />
      <circle cx="18" cy="19" r="6" fill="#818cf8" />
      <text x="32" y="23" class="node-label">Vector Rerank</text>
    </g>

    <!-- Node 3: Real-Time Personalization -->
    <g transform="translate(1030, 85)">
      <rect width="125" height="38" rx="8" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.2" />
      <circle cx="18" cy="19" r="6" fill="#c084fc" />
      <text x="32" y="23" class="node-label">1:1 Predictive UI</text>
    </g>

    <!-- Node 4: Graph / Collaborative Filtering -->
    <g transform="translate(850, 230)">
      <rect width="115" height="38" rx="8" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.2" />
      <circle cx="18" cy="19" r="6" fill="#34d399" />
      <text x="32" y="23" class="node-label">Graph RecSys</text>
    </g>

    <!-- Node 5: Real-time Bandit -->
    <g transform="translate(1010, 235)">
      <rect width="125" height="38" rx="8" fill="url(#cardGrad)" stroke="#f472b6" stroke-width="1.2" />
      <circle cx="18" cy="19" r="6" fill="#f472b6" />
      <text x="32" y="23" class="node-label">Contextual MAB</text>
    </g>
  </g>

  <!-- High-Z Foreground Text & Branding -->
  <g transform="translate(70, 75)">
    <!-- Category Pill Tag -->
    <g transform="translate(0, 0)">
      <rect width="260" height="28" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" />
      <circle cx="14" cy="14" r="4.5" fill="#38bdf8" />
      <text x="26" y="19" class="pill-text">AI / ML PERSONALIZATION &amp; RECSYS</text>
    </g>

    <!-- Main Title with Gradient fill -->
    <text x="0" y="70" class="title">Personalization Recommendation Engine</text>

    <!-- Subtitle -->
    <text x="0" y="108" class="subtitle">Curated catalog of enterprise SaaS platforms, predictive algorithms &amp; open-source RecSys stacks</text>

    <!-- Architecture & Capability Badges -->
    <g transform="translate(0, 142)">
      <!-- Badge 1 -->
      <g transform="translate(0, 0)">
        <rect width="170" height="34" rx="8" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.14)" stroke-width="1" />
        <text x="14" y="22" class="pill-text">⚡ Real-Time Collaborative</text>
      </g>
      <!-- Badge 2 -->
      <g transform="translate(182, 0)">
        <rect width="155" height="34" rx="8" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.14)" stroke-width="1" />
        <text x="14" y="22" class="pill-text">🧠 Deep Learning &amp; DLRM</text>
      </g>
      <!-- Badge 3 -->
      <g transform="translate(349, 0)">
        <rect width="155" height="34" rx="8" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.14)" stroke-width="1" />
        <text x="14" y="22" class="pill-text">🎯 Vector Hybrid Rerank</text>
      </g>
      <!-- Badge 4 -->
      <g transform="translate(516, 0)">
        <rect width="145" height="34" rx="8" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.14)" stroke-width="1" />
        <text x="14" y="22" class="pill-text">📊 Contextual Bandits</text>
      </g>
    </g>

    <!-- Metadata Highlight Row -->
    <g transform="translate(0, 202)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#64748b">
        ECOSYSTEM: <tspan fill="#38bdf8" font-weight="600">Enterprise SaaS Leaders</tspan> • <tspan fill="#a855f7" font-weight="600">Open-Source Frameworks</tspan> • <tspan fill="#34d399" font-weight="600">Vector &amp; Feature Stores</tspan>
      </text>
    </g>
  </g>

  <!-- Bottom Accent Edge Line -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#primaryGrad)" />
</svg>
